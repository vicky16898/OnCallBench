# ── Namespaces ──────────────────────────────────────────────────
# oncall-system: the app itself (backend, frontend, RBAC)
# oncall-bench:  sandbox for injected failure scenarios (safe to nuke)
apiVersion: v1
kind: Namespace
metadata:
  name: oncall-system

---
apiVersion: v1
kind: Namespace
metadata:
  name: oncall-bench

---
# 1. RBAC - Give the app permissions to manage the cluster
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oncall-admin
  namespace: oncall-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oncall-admin-role
rules:
- apiGroups: ["", "apps", "networking.k8s.io", "batch"]
  resources: ["pods", "pods/log", "events", "namespaces", "deployments", "services", "configmaps", "secrets", "networkpolicies", "jobs", "replicasets", "statefulsets", "daemonsets", "ingresses"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oncall-admin-binding
subjects:
- kind: ServiceAccount
  name: oncall-admin
  namespace: oncall-system
roleRef:
  kind: ClusterRole
  name: oncall-admin-role
  apiGroup: rbac.authorization.k8s.io

---
# 2. Config - Add your Google API Key here
apiVersion: v1
kind: Secret
metadata:
  name: oncall-secrets
  namespace: oncall-system
type: Opaque
stringData:
  GOOGLE_API_KEY: "replace_with_your_key"

---
# 3. Backend - The FastAPI engine
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oncall-backend
  namespace: oncall-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oncall-backend
  template:
    metadata:
      labels:
        app: oncall-backend
    spec:
      serviceAccountName: oncall-admin
      containers:
      - name: backend
        image: oncall-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              name: oncall-secrets
              key: GOOGLE_API_KEY
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: oncall-backend
  namespace: oncall-system
spec:
  selector:
    app: oncall-backend
  ports:
  - port: 8000
    targetPort: 8000

---
# 4. Frontend - The React UI (Nginx)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oncall-frontend
  namespace: oncall-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oncall-frontend
  template:
    metadata:
      labels:
        app: oncall-frontend
    spec:
      containers:
      - name: frontend
        image: oncall-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: oncall-frontend
  namespace: oncall-system
spec:
  type: NodePort
  selector:
    app: oncall-frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
