apiVersion: apps/v1
kind: Deployment
metadata:
  name: portmismatch-app
  namespace: oncall-bench
  labels:
    app: portmismatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portmismatch
  template:
    metadata:
      labels:
        app: portmismatch
    spec:
      containers:
      - name: app
        image: nginx:latest
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 9090  # Nginx listens on 80, probe checks 9090 — pod stays Not Ready
          initialDelaySeconds: 2
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: portmismatch-svc
  namespace: oncall-bench
spec:
  selector:
    app: portmismatch
  ports:
  - port: 80
    targetPort: 9090  # Also wrong at the Service level
