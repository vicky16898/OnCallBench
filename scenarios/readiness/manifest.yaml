apiVersion: apps/v1
kind: Deployment
metadata:
  name: readiness-app
  namespace: oncall-bench
  labels:
    app: readiness
spec:
  replicas: 1
  selector:
    matchLabels:
      app: readiness
  template:
    metadata:
      labels:
        app: readiness
    spec:
      containers:
      - name: app
        image: nginx:latest
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 8080 # App listens on 80, readiness checks 8080
          initialDelaySeconds: 2
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: readiness-svc
  namespace: oncall-bench
spec:
  selector:
    app: readiness
  ports:
  - port: 80
    targetPort: 80
