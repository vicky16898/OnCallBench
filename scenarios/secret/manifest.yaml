apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-app
  namespace: oncall-bench
  labels:
    app: secret
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secret
  template:
    metadata:
      labels:
        app: secret
    spec:
      containers:
      - name: app
        image: busybox
        command: ["sh", "-c", "echo Using secret: $DB_PASSWORD && sleep 3600"]
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials  # This Secret doesn't exist
              key: password
---
apiVersion: v1
kind: Service
metadata:
  name: secret-svc
  namespace: oncall-bench
spec:
  selector:
    app: secret
  ports:
  - port: 80
    targetPort: 80
